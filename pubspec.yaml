name: easy_film
description: Flutter media remote client for qBittorrent and FileBrowser.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  file_picker: ^10.3.2
  flutter_secure_storage: ^9.2.4
  background_downloader: ^9.2.2
  go_router: ^16.2.1
  equatable: ^2.0.7
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  web_socket_channel: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
